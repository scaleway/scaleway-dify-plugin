name: Sync models from models.dev

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays at 06:00 UTC
  workflow_dispatch: 

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt pytest

      - name: Generate model files
        run: python scripts/sync_models.py

      - name: Run the tests (also validates every model file)
        run: python -m pytest

      - name: Open a pull request if anything changed
        uses: peter-evans/create-pull-request@v7
        with:
          branch: automation/sync-models
          delete-branch: true
          commit-message: "chore: sync model files from models.dev"
          title: "Sync model files from models.dev"
          body: Model files regenerated by `scripts/sync_models.py` from models.dev.
          add-paths: models/